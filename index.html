<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2e7d32"><title>Chilli Farm Manager</title><style>
:root{--g:#2e7d32;--r:#c62828;--bg:#f2f5ef;--c:#fff;--t:#1b1f1a;--m:#667;--b:#d9e0d5}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:84px}
header{background:var(--g);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}
#sv{font-size:14px;opacity:0;padding:0 8px;border-radius:8px}
main{max-width:900px;margin:auto;padding:10px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
h2{margin:2px 0 10px;font-size:19px}
button{font:inherit;min-height:46px;padding:8px 12px;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:600}
button.s{background:#e3e9e0;color:var(--t)}button.d{background:var(--r)}button.b{width:100%;min-height:62px;font-size:19px;margin-bottom:10px}
input,select{font:inherit;min-height:46px;padding:6px 10px;border:1px solid var(--b);border-radius:10px;width:100%;margin-bottom:8px;background:#fff}
.kg{text-align:right;font-size:20px;font-weight:700;margin:0}.lo{color:var(--r);border-color:var(--r)}.hi{color:var(--g);border-color:var(--g)}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;margin:0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sc{background:var(--bg);border-radius:10px;padding:10px;font-size:14px;color:var(--m)}.sc b{display:block;font-size:20px;color:var(--t)}
.e{display:grid;grid-template-columns:1fr 130px;gap:4px 8px;align-items:center}.e small{grid-column:1/3;color:var(--m)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:6px 0;font-size:11px;color:var(--m)}nav a.on{color:var(--g);font-weight:700}nav i{display:block;font-size:21px;font-style:normal}
a{color:var(--g);font-weight:600;cursor:pointer}small{color:var(--m)}.warn{background:#fff3cd;border-color:#e0b100}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;border-bottom:1px solid var(--b);text-align:right;font-size:14px;white-space:nowrap}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--c)}td .kg{width:62px;font-size:16px;padding:6px 4px}
.tag{padding:2px 8px;border-radius:9px;font-size:12px;font-weight:700}.Paid{background:#c8e6c9}.Unpaid{background:#ffcdd2}.Partial{background:#ffe0b2}
#prt{display:none}@media print{body>*:not(#prt){display:none}#prt{display:block;padding:20px;color:#000}}
</style></head><body><header><b id="fn"></b><span id="sv"></span></header><main id="app"></main><nav id="nv"></nav><div id="prt"></div><script>
const KEY='chilliFarmV1',DN=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],$=s=>document.querySelector(s);
let db,view='home',sel,q='',eid,rep={},first=0,tm,lf;
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),pd=s=>{const a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])},add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)},di=s=>(pd(s).getDay()+6)%7,mon=s=>add(s,-di(s)),fd=s=>pd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
sel=ymd(new Date());
const def=()=>({settings:{farm:'',cur:'KSh',price:20,target:0,sun:false,setup:false,bk:0},employees:[],weeks:{}});
function load(){try{db=JSON.parse(localStorage.getItem(KEY))||def()}catch(e){try{localStorage.setItem(KEY+'_bad',localStorage.getItem(KEY))}catch(x){}db=def()}}
function flash(t,bad){const s=$('#sv');s.textContent=t;s.style.opacity=1;s.style.background=bad?'#c62828':'';clearTimeout(tm);if(!bad)tm=setTimeout(()=>s.style.opacity=.6,1500)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));flash('✓ Saved')}catch(e){flash('⚠ NOT SAVED — export a backup!',1)}}
const M=n=>db.settings.cur+' '+Math.round(n).toLocaleString('en-US'),K=n=>(Math.round(n*100)/100).toLocaleString('en-US')+' kg',set=(s,t)=>{const x=$(s);if(x)x.textContent=t},
nm=id=>(db.employees.find(e=>e.id==id)||{name:'(deleted)'}).name,
wk=m=>db.weeks[m],px=m=>wk(m)?wk(m).price:db.settings.price,dk=(m,id)=>wk(m)&&wk(m).kg[id]||[],
wkg=(m,id)=>dk(m,id).reduce((a,b)=>a+(+b||0),0),owed=(m,id)=>wkg(m,id)*px(m),paid=(m,id)=>wk(m)&&wk(m).paid[id]||0,
emps=m=>db.employees.filter(e=>e.active||wkg(m,e.id)>0),
sts=(m,id)=>{const o=Math.round(owed(m,id)),p=paid(m,id);return o==0&&p==0?'—':p>=o?'Paid':p>0?'Partial':'Unpaid'},
tag=s=>s=='—'?s:`<span class="tag ${s}">${s=='Partial'?'Partially Paid':s}</span>`,
ens=m=>db.weeks[m]||(db.weeks[m]={id:'w'+m,price:db.settings.price,kg:{},paid:{}}),
sc=(l,v,i='')=>`<div class=sc>${l}<b ${i?'id='+i:''}>${v}</b></div>`,
kin=(m,id,d)=>{const v=dk(m,id)[d],t=db.settings.target,c=t>0&&v>0?(v<t?' lo':' hi'):'';return `<input class="kg${c}" inputmode=decimal enterkeyhint=next autocomplete=off placeholder="0" value="${v??''}" data-p="${v??''}" oninput="ki(this,'${m}','${id}',${d})" onchange="ki(this,'${m}','${id}',${d},1)" onkeydown="kd(event)" onfocus="this.select();lf=this">`};
function stats(id,a,b){const r={kg:0,cost:0,paid:0,days:0,weeks:0,best:0,ds:new Set(),rows:[]};Object.keys(db.weeks).sort().forEach(m=>{const w=db.weeks[m];(id?[id]:Object.keys(w.kg)).forEach(e=>{let k=0;(w.kg[e]||[]).forEach((v,i)=>{const s=add(m,i);if(v>0&&(!a||s>=a)&&(!b||s<=b)){k+=v;r.days++;r.ds.add(s);r.best=Math.max(r.best,v)}});if(!k)return;const t=wkg(m,e),po=(w.paid[e]||0)*k/t;r.kg+=k;r.cost+=k*w.price;r.paid+=po;r.weeks++;r.rows.push({m,e,k,c:k*w.price,po})})});return r}
function ki(el,m,id,d,fin){let v=el.value.trim();if(!/^\d*[.,]?\d*$/.test(v)){el.value=el.dataset.p||'';return flash('⚠ Positive numbers only')}
let n=v===''?null:parseFloat(v.replace(',','.')),big=n>500;
if(fin&&big&&!confirm(K(n)+' in one day is unusually large. Is that correct?')){el.value=el.dataset.p||'';v=el.value;n=v===''?null:parseFloat(v)}else if(!big||fin)el.dataset.p=el.value;
if(isNaN(n))n=null;const w=ens(m);(w.kg[id]=w.kg[id]||Array(7).fill(null))[d]=n;const t=db.settings.target;el.classList.toggle('lo',t>0&&n>0&&n<t);el.classList.toggle('hi',t>0&&n>=t);save();tot()}
function kd(e){if(e.key!='Enter')return;e.preventDefault();const a=[...document.querySelectorAll('input.kg')],i=a.indexOf(e.target);a[i+1]?a[i+1].focus():e.target.blur()}
function nx(n){const a=[...document.querySelectorAll('input.kg')],i=a.indexOf(lf);if(a.length)a[Math.max(0,Math.min(a.length-1,i+n))].focus()}
function tot(){const m=mon(sel),d=di(sel);if(view=='daily'){let k=0,n=0;const T=db.settings.target;emps(m).forEach(e=>{const v=+dk(m,e.id)[d]||0;k+=v;n+=v>0;const x=$('#r-'+e.id);if(x)x.innerHTML=`Week: ${K(wkg(m,e.id))} · Owed: <b>${M(owed(m,e.id))}</b>`+(T>0&&v>0?(v>=T?' · <span style=color:var(--g)>✓ target</span>':' · <span style=color:var(--r)>below target</span>'):'')});set('#tk',K(k));set('#tc',M(k*px(m)));set('#tn',n);set('#ta',n?K(k/n):'0 kg')}else if(view=='week')wt()}
function wt(){const m=mon(sel);let k=0;emps(m).forEach(e=>{const t=wkg(m,e.id),o=owed(m,e.id),p=paid(m,e.id),s=sts(m,e.id);k+=t;set('#wt-'+e.id,K(t));set('#wo-'+e.id,M(o));set('#po-'+e.id,M(o));set('#pb-'+e.id,M(o-p));const x=$('#ps-'+e.id);if(x)x.innerHTML=tag(s)});set('#xk',K(k));set('#xc',M(k*px(m)));set('#xa',k?db.settings.cur+' '+(k*px(m)/k).toFixed(2):'—')}
function dlist(){const m=mon(sel),d=di(sel),b=$('#dl'),all=emps(m),s=q.trim().toLowerCase(),L=all.filter(e=>e.name.toLowerCase().includes(s));
if(d==6&&!db.settings.sun){b.innerHTML='<div class=card>Sunday is not set as a working day.<br><br><button onclick="db.settings.sun=true;save();render()">Enable Sunday as a working day</button></div>';return}
b.innerHTML=(!all.length?'<div class=card>No employees yet. Add them in Staff.</div>':!L.length?`<div class=card>No employees found<br><br><button class=s onclick="q='';$('#qs').value='';dlist()">Clear search</button></div>`:(s&&L.length>1?'<div class=row><button class=s onclick=nx(-1)>← Prev employee</button><button class=s onclick=nx(1)>Next employee →</button></div>':'')+L.map(e=>`<div class="card e"><b>${E(e.name)}</b>${kin(m,e.id,d)}<small id=r-${e.id}></small></div>`).join(''))+`<div class=card><div class=g>`+sc('Total kg picked today','','tk')+sc('Est. labour cost today','','tc')+sc('Employees working today','','tn')+sc('Avg kg per employee','','ta')+`</div></div>`;tot()}
function nd(i){let s=add(sel,i);while(di(s)==6&&!db.settings.sun)s=add(s,i);sel=s;render()}
function todayEntry(){sel=ymd(new Date());q='';go('daily');const i=$('input.kg');if(i)i.focus()}
function wprice(m,v){v=parseFloat(v);if(!(v>=0)){flash('⚠ Invalid price');return render()}ens(m).price=v;save();render()}
function setPaid(m,id,v){const n=v===''?0:parseFloat(v);if(!(n>=0))return flash('⚠ Invalid amount');ens(m).paid[id]=n;save();wt()}
function markPaid(m,id){ens(m).paid[id]=Math.round(owed(m,id));save();render()}
function delWeek(m){if(confirm('Delete the week of '+fd(m)+' and ALL its kg and payment records? This cannot be undone.')){delete db.weeks[m];save();render()}}
function weeksList(){const ks=Object.keys(db.weeks).sort().reverse();return `<div class=card><h2>🗂 Recorded weeks</h2>`+(ks.length?ks.map(m=>{const S=stats(null,m,add(m,6));return `<div class=row style="align-items:center"><span style="flex:3">${fd(m)}<br><small>${K(S.kg)} · ${M(S.cost)}</small></span><button class=s onclick="sel='${m}';render()">Open</button><button class=d onclick="delWeek('${m}')">🗑</button></div>`}).join(''):'<p>None yet.</p>')+'</div>'}
const demoBar=()=>db.employees.some(e=>e.demo)?'<div class="card warn">⚠️ DEMO DATA is loaded — test data only, not real records.<br><br><button class=d onclick=rmDemo()>Remove demo data</button></div>':'';
const V={
home(){const m=mon(ymd(new Date())),L=emps(m).filter(e=>wkg(m,e.id)>0),S=stats(null,m,add(m,6)),T=L.map(e=>[e.name,wkg(m,e.id)]).sort((a,b)=>b[1]-a[1]).slice(0,5),bk=db.settings.bk,days=Math.floor((Date.now()-bk)/864e5);
return demoBar()+`<button class=b onclick=todayEntry()>📋 ENTER TODAY'S HARVEST</button><div class=card><h2>This week: ${fd(m)} – ${fd(add(m,5))}</h2><div class=g>`+sc('Employees working',L.length)+sc('Total kg',K(S.kg))+sc('Labour cost',M(S.cost))+sc('Already paid',M(S.paid))+sc('Still owed',M(S.cost-S.paid))+sc('Avg kg / employee',L.length?K(S.kg/L.length):'0 kg')+sc('Avg cost / kg',S.kg?db.settings.cur+' '+(S.cost/S.kg).toFixed(2):'—')+`</div></div><div class=card><h2>🏆 Top pickers this week</h2>`+(T.length?T.map((t,i)=>`<p>${i+1}. ${E(t[0])} — <b>${K(t[1])}</b></p>`).join(''):'<p>No harvest recorded yet.</p>')+`</div><div class="card ${!bk||days>7?'warn':''}">💾 Last backup: ${bk?days+' day(s) ago':'never'}<br><br><button class=s onclick=expJson()>Export backup now</button></div>`},
daily(){const m=mon(sel),d=di(sel),n=db.settings.sun?7:6;
return `<button class=b onclick=todayEntry()>📋 ENTER TODAY'S HARVEST</button><div class=card><h2>${DN[d].toUpperCase()} — ${pd(sel).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}).toUpperCase()}</h2><small>Week ${fd(m)} – ${fd(add(m,n-1))} · ${db.settings.cur} ${px(m)}/kg</small><div class=row style="margin-top:8px"><button class=s onclick=nd(-1)>← Prev day</button><button class=s onclick="sel=ymd(new Date());render()">Today</button><button class=s onclick=nd(1)>Next day →</button></div><div class=row>`+DN.slice(0,n).map((x,i)=>`<button class="${i==d?'':'s'}" style="padding:8px 2px" onclick="sel='${add(m,i)}';render()">${x.slice(0,3)}</button>`).join('')+`</div><input type=date value="${sel}" onchange="if(this.value){sel=this.value;render()}"><input id=qs type=search placeholder="🔍 Search employee" value="${E(q)}" oninput="q=this.value;dlist()"></div><div id=dl></div>`},
week(){const m=mon(sel),w=wk(m),L=emps(m),n=db.settings.sun?7:6,c=db.settings.cur;
return `<div class=card><h2>📅 ${fd(m)} – ${fd(add(m,n-1))}</h2><div class=row><button class=s onclick="sel=add(mon(sel),-7);render()">← Previous</button><button class=s onclick="sel=ymd(new Date());render()">Current</button><button class=s onclick="sel=add(mon(sel),7);render()">Next →</button></div><input type=date value="${sel}" onchange="if(this.value){sel=this.value;render()}"><label>Price used this week (${c}/kg)</label><input value="${px(m)}" inputmode=decimal onchange="wprice('${m}',this.value)"><small>${w?(w.price!=db.settings.price?'This week keeps its own price (current price: '+db.settings.price+'). ':'')+'Editing it here only affects this week.':'No data yet — new entries will use the current price ('+db.settings.price+'). Edit to override for this week.'}</small></div>`+
`<div class="card w"><table><tr><th>Employee`+DN.slice(0,n).map(x=>'<th>'+x.slice(0,2)).join('')+`<th>Total<th>Owed</tr>`+L.map(e=>`<tr><td><a onclick="emp('${e.id}')">${E(e.name)}</a>`+DN.slice(0,n).map((x,i)=>'<td>'+kin(m,e.id,i)).join('')+`<td id=wt-${e.id}><td id=wo-${e.id}></tr>`).join('')+`</table>${L.length?'':'<p>No employees yet.</p>'}</div><div class=card><div class=g>`+sc('TOTAL FARM KG','','xk')+sc('TOTAL LABOUR COST','','xc')+sc('Avg cost per kg','','xa')+`</div></div><div class="card w"><h2>💰 Payments</h2><table><tr><th>Employee<th>Owed<th>Paid<th>Balance<th>Status<th></tr>`+L.map(e=>`<tr><td>${E(e.name)}<td id=po-${e.id}><td><input style="width:90px;margin:0" inputmode=decimal value="${paid(m,e.id)||''}" placeholder=0 onchange="setPaid('${m}','${e.id}',this.value)"><td id=pb-${e.id}><td id=ps-${e.id}><td><button style="min-height:40px" onclick="markPaid('${m}','${e.id}')">Paid ✓</button> <button class=s style="min-height:40px" onclick="stmt('${m}','${e.id}')">🖨</button>`).join('')+`</table></div>`+weeksList()},
staff(){return (first?`<div class="card warn">✅ Add your employees below, then start recording.<br><br><button class=b style="margin:0" onclick="first=0;todayEntry()">Start harvest entry →</button></div>`:'')+`<div class=card><h2>＋ Add employee</h2><input id=nn placeholder="Employee name" onkeydown="if(event.key=='Enter')addE()"><input id=np inputmode=tel placeholder="Phone (optional)"><button onclick=addE()>Add employee</button></div>`+db.employees.map(e=>`<div class=card><b>${E(e.name)}</b> ${e.active?'':'<span class=tag style="background:#ddd">inactive</span>'}<br><small>${E(e.phone||'')}</small><div class=row style="margin-top:8px"><button class=s onclick="emp('${e.id}')">View</button><button class=s onclick="ren('${e.id}')">Edit</button><button class=s onclick="tgl('${e.id}')">${e.active?'Deactivate':'Reactivate'}</button><button class=d onclick="delE('${e.id}')">Delete</button></div></div>`).join('')},
emp(){const e=db.employees.find(x=>x.id==eid);if(!e)return V.staff();const m=mon(sel),k=dk(m,eid),S=stats(eid),o=owed(m,eid),n=db.settings.sun?7:6,c=db.settings.cur,bw=S.rows.reduce((a,r)=>Math.max(a,r.k),0);
return `<div class=card><h2>${E(e.name)}</h2><small>${e.phone?E(e.phone)+' · ':''}Week ${fd(m)} – ${fd(add(m,n-1))}</small><div class=row style="margin:8px 0"><button class=s onclick="sel=add(mon(sel),-7);render()">← Prev week</button><button class=s onclick="sel=add(mon(sel),7);render()">Next week →</button></div>`+DN.slice(0,n).map((x,i)=>`<p>${x}: <b>${K(+k[i]||0)}</b></p>`).join('')+`<hr><p>Total: <b>${K(wkg(m,eid))}</b><br>Rate: ${c} ${px(m)}/kg<br>Amount owed: <b>${M(o)}</b><br>Paid: ${M(paid(m,eid))} · Balance: ${M(o-paid(m,eid))}<br>${tag(sts(m,eid))}</p><button onclick="stmt('${m}','${eid}')">🖨 Payment statement</button></div><div class=card><h2>History (all weeks)</h2><div class=g>`+sc('Total kg',K(S.kg))+sc('Total owed',M(S.cost))+sc('Total paid',M(S.paid))+sc('Avg kg / day worked',S.days?K(S.kg/S.days):'—')+sc('Avg kg / week',S.weeks?K(S.kg/S.weeks):'—')+sc('Best day',K(S.best))+sc('Best week',K(bw))+sc('Days worked',S.days)+`</div></div>`},
rep(){const t=ymd(new Date()),a=rep.a||add(t,-30),b=rep.b||t,F=stats(null,a,b),id=rep.e||(db.employees[0]||{}).id,S=id?stats(id):0,c=db.settings.cur;
return `<div class=card><h2>Farm report</h2><div class=row><input type=date value="${a}" onchange="rep.a=this.value;render()"><input type=date value="${b}" onchange="rep.b=this.value;render()"></div><div class=g>`+sc('Total kg',K(F.kg))+sc('Labour cost',M(F.cost))+sc('Total paid',M(F.paid))+sc('Outstanding',M(F.cost-F.paid))+sc('Avg price/kg (= labour cost/kg)',F.kg?c+' '+(F.cost/F.kg).toFixed(2):'—')+sc('Avg kg/day',F.ds.size?K(F.kg/F.ds.size):'—')+`</div></div><div class=card><h2>Employee report</h2><select onchange="rep.e=this.value;render()">`+db.employees.map(e=>`<option value=${e.id} ${e.id==id?'selected':''}>${E(e.name)}</option>`).join('')+`</select>`+(S?`<div class=g>`+sc('Total kg',K(S.kg))+sc('Total earnings',M(S.cost))+sc('Avg weekly kg',S.weeks?K(S.kg/S.weeks):'—')+sc('Avg daily kg',S.days?K(S.kg/S.days):'—')+sc('Weeks worked',S.weeks)+`</div><br><div class=w><table><tr><th>Week<th>Kg<th>Owed<th>Paid<th>Status</tr>`+S.rows.slice().reverse().map(r=>`<tr><td>${fd(r.m)}<td>${K(r.k)}<td>${M(r.c)}<td>${M(paid(r.m,r.e))}<td>${tag(sts(r.m,r.e))}`).join('')+`</table></div>`:'<p>No employees yet.</p>')+`</div><div class="card w"><h2>Weekly report</h2><table><tr><th>Week<th>Kg<th>Cost<th>Paid<th>Owed<th>Kg/day</tr>`+Object.keys(db.weeks).sort().reverse().map(m=>{const W=stats(null,m,add(m,6));return `<tr><td>${fd(m)}<td>${K(W.kg)}<td>${M(W.cost)}<td>${M(W.paid)}<td>${M(W.cost-W.paid)}<td>${W.ds.size?K(W.kg/W.ds.size):'—'}`}).join('')+`</table></div>`},
sett(){const s=db.settings;return `<div class=card><h2>⚙️ Settings</h2><label>Farm name</label><input value="${E(s.farm)}" onchange="cfg('farm',this.value)"><label>Currency</label><input value="${E(s.cur)}" onchange="cfg('cur',this.value)"><label>Current price per kg</label><input inputmode=decimal value="${s.price}" onchange="cfg('price',this.value)"><small>Applies to NEW weeks only. Past weeks keep the price they were recorded with (change one week's price on the Week screen).</small><label style="display:block;margin-top:8px">Daily target kg (0 = off)</label><input inputmode=decimal value="${s.target}" onchange="cfg('target',this.value)"><label><input type=checkbox style="width:24px;min-height:0;vertical-align:middle" ${s.sun?'checked':''} onchange="cfg('sun',this.checked)"> Sunday is a working day (default: Mon–Sat)</label></div><div class=card><h2>💾 Backup</h2><div class=row><button onclick=expJson()>Export backup (JSON)</button></div><div class=row><button class=s onclick=imp0()>Import backup</button><input type=file id=fi accept=".json,application/json" hidden onchange=imp(this)></div><div class=row><button class=s onclick=expCsv()>CSV: daily records</button><button class=s onclick=expPay()>CSV: payments</button></div></div><div class=card><h2>🧪 Test / Reset</h2><div class=row><button class=s onclick=demo()>Load demo data</button><button class=d onclick=wipe()>Reset everything</button></div></div>`},
setup(){return `<div class=card><h2>🌶️ Welcome — set up your farm</h2><label>Farm name</label><input id=sf placeholder="e.g. Kamau Chilli Farm"><label>Currency</label><input id=sc2 value=KSh><label>Price per kg</label><input id=sp inputmode=decimal value=20><label>Daily target kg (optional)</label><input id=st2 inputmode=decimal placeholder="e.g. 40"><button class=b onclick=doSetup()>Continue: add first employee</button><button class=s onclick=imp0()>Or restore from a backup</button><input type=file id=fi accept=".json,application/json" hidden onchange=imp(this)></div>`}};
function doSetup(){const p=parseFloat($('#sp').value);if(!(p>0))return flash('⚠ Enter a price per kg');Object.assign(db.settings,{farm:$('#sf').value.trim(),cur:$('#sc2').value.trim()||'KSh',price:p,target:parseFloat($('#st2').value)||0,setup:true});save();first=1;go('staff')}
function cfg(k,v){if(k=='price'||k=='target'){v=parseFloat(v);if(!(v>=0)){flash('⚠ Invalid number');return render()}}db.settings[k]=v;save();render()}
function emp(id){eid=id;go('emp')}
function addE(){const n=$('#nn').value.trim();if(!n)return flash('⚠ Enter a name');if(db.employees.some(e=>e.name.toLowerCase()==n.toLowerCase())&&!confirm('"'+n+'" already exists. Add another?'))return;db.employees.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,phone:$('#np').value.trim(),active:true});save();render()}
function ren(id){const e=db.employees.find(x=>x.id==id),n=prompt('Employee name:',e.name);if(n&&n.trim()){e.name=n.trim();const p=prompt('Phone (optional):',e.phone||'');if(p!==null)e.phone=p.trim();save();render()}}
function tgl(id){const e=db.employees.find(x=>x.id==id);e.active=!e.active;save();render()}
function delE(id){if(confirm('Delete '+nm(id)+' AND all their records? This cannot be undone.\n\nTip: use Deactivate to keep history.')&&confirm('Really delete '+nm(id)+' permanently?')){db.employees=db.employees.filter(e=>e.id!=id);Object.values(db.weeks).forEach(w=>{delete w.kg[id];delete w.paid[id]});save();render()}}
function dn(n,t,y){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:y}));a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5e3)}
function expJson(){dn('chilli-farm-backup-'+ymd(new Date())+'.json',JSON.stringify(db,null,1),'application/json');db.settings.bk=Date.now();save();render()}
const csv=R=>'\ufeff'+R.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
function expCsv(){const R=[['Employee','Week start','Date','Day','KG','Price per kg','Amount']];Object.keys(db.weeks).sort().forEach(m=>{const w=db.weeks[m];Object.keys(w.kg).forEach(id=>w.kg[id].forEach((v,i)=>{if(v>0)R.push([nm(id),m,add(m,i),DN[i],v,w.price,Math.round(v*w.price*100)/100])}))});dn('chilli-daily-records.csv',csv(R),'text/csv')}
function expPay(){const R=[['Employee','Week start','Week end','Total KG','Price per kg','Owed','Paid','Balance','Status']];Object.keys(db.weeks).sort().forEach(m=>Object.keys(db.weeks[m].kg).forEach(id=>{const t=wkg(m,id);if(t>0)R.push([nm(id),m,add(m,6),t,px(m),Math.round(owed(m,id)),paid(m,id),Math.round(owed(m,id))-paid(m,id),sts(m,id)])}));dn('chilli-payments.csv',csv(R),'text/csv')}
function imp0(){$('#fi').click()}
function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.employees)||typeof d.weeks!='object'||!d.settings)throw 0;
try{localStorage.setItem(KEY+'_prev',JSON.stringify(db))}catch(x){}
if(confirm('Restore backup from '+f.name+'?\n\nOK = REPLACE current data with the backup.\nCancel = see the MERGE option.')){db=d;db.settings=Object.assign(def().settings,d.settings)}
else if(confirm('MERGE instead? Adds employees, weeks and entries that are missing here; existing entries stay unchanged.\n\nCancel = change nothing.')){d.employees.forEach(e=>{if(!db.employees.some(x=>x.id==e.id))db.employees.push(e)});Object.keys(d.weeks).forEach(m=>{const w=d.weeks[m],x=db.weeks[m];if(!x)db.weeks[m]=w;else Object.keys(w.kg).forEach(id=>{if(!x.kg[id]){x.kg[id]=w.kg[id];if(w.paid[id])x.paid[id]=w.paid[id]}})})}else return;
db.settings.setup=true;save();render();flash('✓ Backup restored')}catch(e){alert('That file is not a valid backup. Nothing was changed.')}inp.value=''};r.readAsText(f)}
function demo(){if(!confirm('Load DEMO (test) data? It adds 4 employees marked "(DEMO)" and one sample week. Your real data is not touched, and you can remove the demo data later.'))return;const m=add(mon(ymd(new Date())),-7);[['John',[35,42,38,45,40,30]],['Peter',[30,37,41,33,36,28]],['Mary',[44,51,47,52.5,49,38]],['David',[25,29,31,27,30,22]]].forEach((x,i)=>{const id='demo'+i,w=ens(m);if(!db.employees.some(e=>e.id==id))db.employees.push({id,name:x[0]+' (DEMO)',active:true,demo:1});w.kg[id]=[...x[1],null];w.paid[id]=i==0?Math.round(x[1].reduce((a,b)=>a+b)*w.price):i==1?2000:0});db.settings.setup=true;save();sel=m;go('week')}
function rmDemo(){if(!confirm('Remove all DEMO employees and their records? Your real data is kept.'))return;const ids=db.employees.filter(e=>e.demo).map(e=>e.id);db.employees=db.employees.filter(e=>!e.demo);Object.keys(db.weeks).forEach(m=>{const w=db.weeks[m];ids.forEach(i=>{delete w.kg[i];delete w.paid[i]});if(!Object.keys(w.kg).length)delete db.weeks[m]});save();render()}
function wipe(){if(confirm('RESET deletes ALL employees, weeks and settings on this device. Export a backup first!\n\nContinue?')&&prompt('Type DELETE to confirm:')=='DELETE'){try{localStorage.setItem(KEY+'_prev',JSON.stringify(db))}catch(e){}db=def();save();view='home';render()}}
function stmt(m,id){const k=dk(m,id),o=Math.round(owed(m,id)),p=paid(m,id),s=sts(m,id),n=db.settings.sun?7:6;$('#prt').innerHTML=`<h2>${E((db.settings.farm||'CHILLI FARM').toUpperCase())} — EMPLOYEE PAYMENT STATEMENT</h2><p>Employee: <b>${E(nm(id))}</b></p><p>Week: ${fd(m)} – ${fd(add(m,n-1))}</p>`+DN.slice(0,n).map((x,i)=>`<p>${x}: ${K(+k[i]||0)}</p>`).join('')+`<hr><p><b>Total KG: ${K(wkg(m,id))}</b></p><p>Rate: ${db.settings.cur} ${px(m)}/kg</p><p>Total owed: ${M(o)}</p><p>Paid: ${M(p)}</p><p>Balance: ${M(o-p)}</p><p><b>Status: ${s=='Partial'?'PARTIALLY PAID':s.toUpperCase()}</b></p><p>Printed ${fd(ymd(new Date()))}</p>`;window.print()}
function go(v){view=v;render();scrollTo(0,0)}
function render(){const S=db.settings;$('#fn').textContent='🌶️ '+(S.farm||'Chilli Farm');if(!S.setup){$('#nv').innerHTML='';$('#app').innerHTML=V.setup();return}
$('#app').innerHTML=V[view]();$('#nv').innerHTML=[['home','🏠','Home'],['daily','📋','Daily'],['week','📅','Week'],['staff','👥','Staff'],['rep','📊','Reports'],['sett','⚙️','Settings']].map(x=>`<a class="${x[0]==view||(view=='emp'&&x[0]=='staff')?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</a>`).join('');
if(view=='daily')dlist();if(view=='week')wt()}
load();try{navigator.storage.persist()}catch(e){}render();
